[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-optimizer-hook"
version = "0.1.0"
description = "Token Optimizer session tracking daemon and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "textual>=0.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
token-optimizer = "hook.cli:main"

[tool.setuptools]
packages = ["hook"]

[tool.setuptools.package-dir]
hook = "."

[tool.pytest.ini_options]
testpaths = ["../../tests/hook"]
pythonpath = ["."]